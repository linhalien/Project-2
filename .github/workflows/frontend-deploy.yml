name: Deploy Frontend to S3 and CloudFront

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Chỉ kích hoạt khi có code mới đẩy lên nhánh main
# VÀ phải có sự thay đổi bên trong thư mục 'frontend'
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

# Cấp quyền cho GitHub Actions được phép sinh OIDC token
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # Thiết lập thư mục làm việc mặc định: frontend
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: 1. Kéo mã nguồn từ GitHub về máy chủ chạy Pipeline
      uses: actions/checkout@v4

    - name: 2. Cài đặt môi trường Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' 

    - name: 3. Cài đặt các gói thư viện 
      run: npm install

    - name: 4. Build dự án 
      run: npm run build
      env:
        REACT_APP_COGNITO_DOMAIN: ${{ secrets.REACT_APP_COGNITO_DOMAIN }}
        REACT_APP_CLIENT_ID: ${{ secrets.REACT_APP_CLIENT_ID }}
        REACT_APP_REDIRECT_URI: ${{ secrets.REACT_APP_REDIRECT_URI }}
        REACT_APP_API_BASE_URL: ${{ secrets.REACT_APP_API_BASE_URL }}

    - name: 5. Xác thực với AWS bằng OIDC Role (Không dùng Access Key)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::336457598104:role/GitHubActions-CICD-Role
        aws-region: ap-southeast-1

    - name: 6. Xóa file cũ và đồng bộ file Build mới lên S3 Bucket
      run: aws s3 sync ./build s3://soc-dashboard-project2-alien --delete

    - name: 7. Xóa Cache cũ trên Cloudfront
      run: aws cloudfront create-invalidation --distribution-id E2MOMI2UBRLMBG --paths "/*"